# Fronteras entre módulos, verificadas automáticamente.
#
# POR QUÉ ESTE FICHERO EXISTE
#
# Un "monolito modular" cuyas fronteras sólo viven en la buena voluntad del equipo deja
# de ser modular en unos meses. Alguien tiene prisa, importa una clase interna de otro
# módulo, nadie lo ve en la revisión, y repetido veinte veces queda una bola de barro
# con carpetas bonitas.
#
# Aquí las fronteras rompen la integración continua. Es la diferencia entre una
# propiedad declarada y una propiedad verificada — la misma distinción que este
# proyecto aplica a la portabilidad del almacenamiento.

deptrac:
  paths:
    - ./app
    - ./database

  layers:
    # --- Dominio -------------------------------------------------------------
    - name: Eligibility
      collectors:
        - type: directory
          value: app/Domains/Eligibility/.*

    - name: Applications
      collectors:
        - type: directory
          value: app/Domains/Applications/.*

    - name: SharedDomain
      collectors:
        - type: directory
          value: app/Domains/Shared/.*

    - name: Audit
      collectors:
        - type: directory
          value: app/Domains/Audit/.*

    - name: Housing
      collectors:
        - type: directory
          value: app/Domains/Housing/.*

    - name: Calls
      collectors:
        - type: directory
          value: app/Domains/Calls/.*

    # --- Frontera de integración ---------------------------------------------
    - name: IntegrationContracts
      collectors:
        - type: directory
          value: app/Integrations/Contracts/.*

    - name: IntegrationAdapters
      collectors:
        - type: directory
          value: app/Integrations/(?!Contracts/).*

    # --- Entrega -------------------------------------------------------------
    - name: Http
      collectors:
        - type: directory
          value: app/Http/.*

    - name: Console
      collectors:
        - type: directory
          value: app/Console/.*

    - name: Providers
      collectors:
        - type: directory
          value: app/Providers/.*

    # --- Base de datos -------------------------------------------------------
    - name: Factories
      collectors:
        - type: directory
          value: database/factories/.*

    - name: Seeders
      collectors:
        - type: directory
          value: database/seeders/.*

    - name: Migrations
      collectors:
        - type: directory
          value: database/migrations/.*

    # --- Terceros ------------------------------------------------------------
    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^(Illuminate|Symfony|Carbon|Laravel)\\.*#'

    # Interfaces PSR. Se separan del framework a propósito: depender de Psr\Log en el
    # dominio es aceptable —es un estándar con muchas implementaciones—, mientras que
    # depender de la fachada Log de Laravel no lo sería.
    - name: Psr
      collectors:
        - type: classNameRegex
          value: '#^Psr\\.*#'

    # Clases de la biblioteca estándar de PHP que el dominio sí puede usar.
    # Se enumeran a propósito: mantener la lista corta es una señal de salud.
    - name: PhpCore
      collectors:
        - type: classNameRegex
          value: '#^(DateTime\w*|DomainException|InvalidArgumentException|RuntimeException|LogicException|Exception|Throwable|Stringable|JsonSerializable|Countable|IteratorAggregate|ArrayAccess|Traversable)$#'

  ruleset:
    # Elegibilidad es PHP puro: no conoce Laravel, ni la base de datos, ni HTTP.
    # Por eso sus pruebas corren en milisegundos y se puede razonar sobre ellas.
    # Esta lista corta es la regla más importante del fichero.
    Eligibility:
      - Eligibility
      - PhpCore

    # Las solicitudes usan las reglas de elegibilidad y hablan con el exterior sólo a
    # través de contratos, nunca de adaptadores concretos.
    Applications:
      - Applications
      - Eligibility
      - SharedDomain
      - Audit
      - IntegrationContracts
      - Framework
      - Psr
      - PhpCore

    # La auditoría no conoce ningún dominio concreto: recibe cadenas y metadatos.
    # Si algún día necesitara importar una solicitud, sería señal de que se está
    # metiendo lógica de negocio en la traza.
    Audit:
      - Audit
      - Framework
      - Psr
      - PhpCore

    # El catálogo es independiente del procedimiento: se pueden publicar viviendas
    # sin que exista ninguna solicitud. Housing NO conoce a Calls — la dirección es
    # la contraria, y deptrac lo hace cumplir.
    Housing:
      - Housing
      - Factories
      - Framework
      - Psr
      - PhpCore

    Calls:
      - Calls
      - Housing
      - Factories
      - Framework
      - Psr
      - PhpCore

    SharedDomain:
      - SharedDomain
      - Framework
      - Psr
      - PhpCore

    # Interfaces y objetos de valor. No dependen de nada de fuera.
    IntegrationContracts:
      - IntegrationContracts
      - PhpCore

    # Un adaptador implementa su contrato y usa el framework. NO puede tocar el
    # dominio: si un adaptador necesita una regla de negocio, la regla está en el
    # sitio equivocado.
    IntegrationAdapters:
      - IntegrationAdapters
      - IntegrationContracts
      - Framework
      - Psr
      - PhpCore

    Http:
      - Http
      - Applications
      - Eligibility
      - SharedDomain
      - Audit
      - Housing
      - Calls
      - IntegrationContracts
      - Framework
      - Psr
      - PhpCore

    Console:
      - Console
      - Applications
      - Eligibility
      - SharedDomain
      - Audit
      - Housing
      - Calls
      - IntegrationContracts
      - Framework
      - Psr
      - PhpCore

    Providers:
      - Providers
      - Applications
      - Eligibility
      - SharedDomain
      - Audit
      - Housing
      - Calls
      - IntegrationContracts
      - IntegrationAdapters
      - Framework
      - Psr
      - PhpCore

    Framework:
      - Framework
      - Psr
      - PhpCore

    PhpCore:
      - PhpCore

    # Las factorías conocen sus modelos; nadie de producción conoce las factorías
    # salvo el propio modelo para declarar la suya.
    Factories:
      - Factories
      - Housing
      - Calls
      - Applications
      - Framework
      - Psr
      - PhpCore

    Seeders:
      - Seeders
      - Factories
      - Housing
      - Calls
      - Framework
      - Psr
      - PhpCore

    # Una migración puede leer una enumeración del dominio para derivar de ella una
    # restricción, que es como se evita tener dos fuentes de verdad para la misma
    # lista de estados.
    Migrations:
      - Migrations
      - Applications
      - Housing
      - Calls
      - Framework
      - Psr
      - PhpCore
